name: Compilar EventoPlugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar con Maven
        id: build
        run: |
          set +e
          mvn -B clean package > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mostrar errores si fallo
        if: steps.build.outputs.exit_code != '0'
        run: |
          grep -n -i -A2 "ERROR\]" build.log | head -100 | sed 's/^/::error::/'
          exit 1

      - name: Subir el .jar como artifact descargable
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: EventoPlugin-jar
          path: target/EventoPlugin.jar
